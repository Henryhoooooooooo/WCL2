<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設郵件已發送</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #18122B 0%, #393053 100%);
            color: #fff;
            font-family: 'Unbounded', 'Montserrat', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(34,34,34,0.98);
            padding: 2.2rem 2.7rem 2.2rem 2.7rem;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(57,48,83,0.18);
            min-width: 320px;
            max-width: 95vw;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.7rem;
            font-weight: 700;
            font-family: 'Unbounded', 'Montserrat', sans-serif;
            font-size: 2.1rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #FF6B6B 10%, #3a7afe 60%, #00e6d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: #b0b8c1;
            font-size: 1.08rem;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container { padding: 1.2rem 0.5rem; min-width: unset; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>重設郵件已發送</h2>
        <p>請檢查你的郵箱，按照郵件中的指示重設密碼。</p>
    </div>
</body>
</html>
