<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶註冊</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #18122B 0%, #393053 100%);
            color: #fff;
            font-family: 'Unbounded', 'Montserrat', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-container {
            background: rgba(34,34,34,0.98);
            padding: 2.2rem 2.7rem 2.2rem 2.7rem;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(57,48,83,0.18);
            min-width: 320px;
            max-width: 95vw;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.7rem;
            font-weight: 700;
            font-family: 'Unbounded', 'Montserrat', sans-serif;
            font-size: 2.1rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #FF6B6B 10%, #3a7afe 60%, #00e6d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b0b8c1;
            font-size: 1.08rem;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1.2rem;
            border: none;
            border-radius: 8px;
            background: #232232;
            color: #fff;
            font-size: 1.08rem;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
        }
        input[type="submit"] {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, #3a7afe 30%, #00e6d0 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.08rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 2px 12px rgba(58,122,254,0.10);
        }
        input[type="submit"]:hover {
            background: linear-gradient(90deg, #FF6B6B 30%, #3a7afe 100%);
            transform: translateY(-2px) scale(1.03);
        }
        .errorlist {
            color: #ff6b6b;
            margin-bottom: 1rem;
            list-style: none;
            padding: 0;
        }
        .helptext {
            color: #b0b8c1;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 600px) {
            .register-container { padding: 1.2rem 0.5rem; min-width: unset; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <form method="post" class="register-container">
        {% csrf_token %}
        <h2>用戶註冊</h2>
        {% if form.errors %}
            <ul class="errorlist">
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error|escape }}</li>
                    {% endfor %}
                {% endfor %}
                {% for error in form.non_field_errors %}
                    <li>{{ error|escape }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <label for="id_username">帳號</label>
        <input type="text" name="username" autofocus required id="id_username" placeholder="請輸入帳號">
        <label for="id_email">郵箱</label>
        <input type="email" name="email" required id="id_email" placeholder="請輸入郵箱">
        <label for="id_password1">密碼</label>
        <input type="password" name="password1" required id="id_password1" placeholder="請輸入密碼">
        <label for="id_password2">確認密碼</label>
        <input type="password" name="password2" required id="id_password2" placeholder="請再次輸入密碼">
        <input type="submit" value="註冊">
        <div class="helptext">已有帳號？<a href="/accounts/login/" style="color:#3a7afe;">登入</a></div>
    </form>
</body>
</html>
