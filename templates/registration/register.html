<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶註冊</title>
    <style>
        body { background: #181818; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background: #232323; padding: 2rem 2.5rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); min-width: 320px; }
        h2 { text-align: center; margin-bottom: 1.5rem; font-weight: 400; }
        label { display: block; margin-bottom: 0.5rem; color: #bbb; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: none; border-radius: 6px; background: #292929; color: #fff; font-size: 1rem; }
        input[type="submit"] { width: 100%; padding: 0.7rem; background: #3a7afe; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        input[type="submit"]:hover { background: #1558b0; }
        .errorlist { color: #ff6b6b; margin-bottom: 1rem; list-style: none; padding: 0; }
        .helptext { color: #888; font-size: 0.95rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <form method="post" class="register-container">
        {% csrf_token %}
        <h2>用戶註冊</h2>
        {% if form.errors %}
            <ul class="errorlist">
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error|escape }}</li>
                    {% endfor %}
                {% endfor %}
                {% for error in form.non_field_errors %}
                    <li>{{ error|escape }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <label for="id_username">帳號</label>
        <input type="text" name="username" autofocus required id="id_username" placeholder="請輸入帳號">
        <label for="id_email">郵箱</label>
        <input type="email" name="email" required id="id_email" placeholder="請輸入郵箱">
        <label for="id_password1">密碼</label>
        <input type="password" name="password1" required id="id_password1" placeholder="請輸入密碼">
        <label for="id_password2">確認密碼</label>
        <input type="password" name="password2" required id="id_password2" placeholder="請再次輸入密碼">
        <input type="submit" value="註冊">
        <div class="helptext">已有帳號？<a href="/accounts/login/" style="color:#3a7afe;">登入</a></div>
    </form>
</body>
</html>
