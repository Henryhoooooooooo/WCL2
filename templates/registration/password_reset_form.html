<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼</title>
    <style>
        body { background: #181818; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #232323; padding: 2rem 2.5rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); min-width: 320px; }
        h2 { text-align: center; margin-bottom: 1.5rem; font-weight: 400; }
        label { display: block; margin-bottom: 0.5rem; color: #bbb; }
        input[type="email"] { width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: none; border-radius: 6px; background: #292929; color: #fff; font-size: 1rem; }
        input[type="submit"] { width: 100%; padding: 0.7rem; background: #3a7afe; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        input[type="submit"]:hover { background: #1558b0; }
        .helptext { color: #888; font-size: 0.95rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <form method="post" class="container">
        {% csrf_token %}
        <h2>忘記密碼</h2>
        <label for="id_email">請輸入註冊郵箱</label>
        <input type="email" name="email" required id="id_email" placeholder="Email">
        <input type="submit" value="發送重設郵件">
        <div class="helptext">系統將發送密碼重設連結到你的郵箱。</div>
    </form>
</body>
</html>
