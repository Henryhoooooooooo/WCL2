<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Exhibition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #18122B 0%, #393053 100%);
            color: #fff;
            font-family: 'Unbounded', 'Montserrat', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            letter-spacing: 0.5px;
        }
        header {
            background: rgba(24,18,43,0.98);
            padding: 2.2rem 0 1.2rem 0;
            text-align: center;
            letter-spacing: 3px;
            box-shadow: 0 4px 32px rgba(57,48,83,0.18);
        }
        header h1 {
            font-size: 2.5rem;
            font-family: 'Unbounded', 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #FF6B6B 10%, #3a7afe 60%, #00e6d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 24px rgba(58,122,254,0.10);
            margin: 0;
        }
        nav {
            background: rgba(17,17,34,0.98);
            padding: 0.7rem 2.5rem;
            text-align: right;
            box-shadow: 0 2px 16px rgba(58,122,254,0.05);
        }
        nav a {
            color: #3a7afe;
            margin-left: 1.2rem;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #FF6B6B;
        }
        nav span {
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            font-size: 1.08rem;
            color: #00e6d0;
            margin-right: 1.2rem;
        }
        nav form button, nav form input[type="submit"] {
            background: linear-gradient(90deg, #3a7afe 30%, #00e6d0 100%);
            color: #fff !important;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.4rem 1.2rem;
            margin-left: 0.7rem;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 2px 12px rgba(58,122,254,0.10);
        }
        nav form button:hover, nav form input[type="submit"]:hover {
            background: linear-gradient(90deg, #FF6B6B 30%, #3a7afe 100%);
            transform: translateY(-2px) scale(1.03);
        }
        nav input[type="text"], nav input[type="password"] {
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            border: none;
            background: #232232;
            color: #fff;
            width: 110px;
            margin-left: 0.5rem;
            font-size: 1rem;
        }
        .unity-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            background: #232232;
        }
        iframe, embed {
            width: 100vw;
            height: 90vh;
            max-width: 100vw;
            max-height: 90vh;
            border: none;
            background: #000;
            display: block;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(58,122,254,0.10);
        }
        @media (max-width: 600px) {
            header h1 { font-size: 1.3rem; }
            nav { padding: 0.5rem 0.5rem; }
            .unity-container { min-height: 60vh; }
            iframe, embed { height: 60vh; border-radius: 8px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Virtual Exhibition</h1>
    </header>

    <nav>
        
        {% if user.is_authenticated %}
            <span style="margin-left:2rem; color:#3a7afe;">您好，尊敬的{{ user.username }}</span>
            <form id="logout-form" action="/logout/" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none;border:none;color:#fafbfc;cursor:pointer;font-weight:bold;">登出</button>
            </form>
        {% else %}
            <form method="post" action="/accounts/login/" style="float:right; margin-left:2rem;">
                {% csrf_token %}
                <input type="text" name="username" placeholder="帳號" style="padding:0.3rem 0.7rem; border-radius:4px; border:none; background:#292929; color:#fff; width:100px;">
                <input type="password" name="password" placeholder="密碼" style="padding:0.3rem 0.7rem; border-radius:4px; border:none; background:#292929; color:#fff; width:100px;">
                <input type="submit" value="登入" style="padding:0.3rem 1.2rem; background:#3a7afe; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                <a href="/register/" style="color:#3a7afe; margin-left:0.5rem;">註冊</a>
            </form>
        {% endif %}
    </nav>
    <div class="unity-container">
        <!-- 將下方 src 替換為你的 Unity WebGL Build 路徑 -->
        <iframe src="/static/UnityBuild/index.html" allowfullscreen title="Unity WebGL 展廳"></iframe>
    </div>
    <div style="width:100%;max-width:900px;margin:2rem auto;">
      <iframe src="https://app.instant3d.ai/" width="100%" height="700" style="border-radius:18px;border:none;box-shadow:0 4px 32px rgba(58,122,254,0.10);" allowfullscreen></iframe>
    </div>
</body>
</html>
