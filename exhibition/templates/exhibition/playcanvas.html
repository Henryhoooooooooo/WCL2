<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCanvas 虛擬展廳</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #18122B 0%, #393053 100%);
            color: #fff;
            font-family: 'Unbounded', 'Montserrat', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            letter-spacing: 0.5px;
        }
        .pc-container {
            max-width: 1200px;
            margin: 3rem auto 0 auto;
            background: rgba(34,34,34,0.98);
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(57,48,83,0.18);
            padding: 2.5rem 2rem 2rem 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-family: 'Unbounded', 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #FF6B6B 10%, #3a7afe 60%, #00e6d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.2rem;
        }
        .pc-iframe {
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 16px;
            background: #000;
            box-shadow: 0 8px 32px rgba(58,122,254,0.10);
            display: block;
        }
        @media (max-width: 900px) {
            .pc-container { padding: 1rem 0.2rem; }
            .pc-iframe { height: 60vw; min-height: 320px; }
        }
    </style>
</head>
<body>
    <div class="pc-container">
        <h1>PlayCanvas 虛擬展廳</h1>
        <!-- 替換下方 src 為你的 PlayCanvas WebGL 項目鏈接 -->
        <iframe class="pc-iframe" src="/static/playcanvas/index.html" allowfullscreen title="PlayCanvas WebGL 展廳"></iframe>
    </div>
</body>
</html>
