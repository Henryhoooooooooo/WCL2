<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 數字人助理 Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #18122B 0%, #393053 100%);
            color: #fff;
            font-family: 'Unbounded', 'Montserrat', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            letter-spacing: 0.5px;
        }
        .assistant-container {
            max-width: 700px;
            margin: 4rem auto 0 auto;
            background: rgba(34,34,34,0.98);
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(57,48,83,0.18);
            padding: 2.5rem 2rem 2rem 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-family: 'Unbounded', 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #FF6B6B 10%, #3a7afe 60%, #00e6d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.2rem;
        }
        .chat-box {
            background: #232232;
            border-radius: 12px;
            min-height: 320px;
            max-height: 400px;
            overflow-y: auto;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            font-size: 1.08rem;
        }
        .chat-msg { margin-bottom: 1.1rem; }
        .chat-msg.user { text-align: right; color: #00e6d0; }
        .chat-msg.ai { text-align: left; color: #fff; }
        .chat-input-row { display: flex; gap: 0.5rem; }
        .chat-input-row input {
            flex: 1;
            padding: 0.7rem;
            border-radius: 8px;
            border: none;
            background: #292929;
            color: #fff;
            font-size: 1.08rem;
        }
        .chat-input-row button {
            background: linear-gradient(90deg, #3a7afe 30%, #00e6d0 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.08rem;
            font-weight: 600;
            padding: 0 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-row button:hover {
            background: linear-gradient(90deg, #FF6B6B 30%, #3a7afe 100%);
        }
    </style>
</head>
<body>
    <div class="assistant-container">
        <h1>AI 數字人助理 Demo</h1>
        <div class="chat-box" id="chatBox"></div>
        <form class="chat-input-row" id="chatForm" autocomplete="off">
            <input type="text" id="userInput" placeholder="請輸入你的問題..." required />
            <button type="submit">發送</button>
        </form>
    </div>
    <script>
    // 簡單的前端即時對話框，與後端 API 互動
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');

    function appendMsg(role, text) {
        const div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        div.textContent = (role === 'user' ? '你：' : 'AI：') + text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.onsubmit = async function(e) {
        e.preventDefault();
        const msg = userInput.value.trim();
        if (!msg) return;
        appendMsg('user', msg);
        userInput.value = '';
        appendMsg('ai', '思考中...');
        // 調用後端API
        const resp = await fetch('/assistant_api/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await resp.json();
        chatBox.lastChild.textContent = 'AI：' + data.reply;
    }
    </script>
</body>
</html>
